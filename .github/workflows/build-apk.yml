name: Build Android APK (Chat GPT)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Chuẩn bị thư mục www và cài Capacitor 6
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android

      - name: Cấu hình quyền Micro, Camera & Giao diện tối Android
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", `<uses-permission android:name="${p}" />\n    <application`);
              }
            }
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", `<application android:usesCleartextTraffic="true"`);
            }
            fs.writeFileSync(manifestPath, xml);

            const stylesPath = "android/app/src/main/res/values/styles.xml";
            let styles = fs.readFileSync(stylesPath, "utf8");
            if (!styles.includes("statusBarColor")) {
              styles = styles.replace(
                "</style>",
                "    <item name=\"android:statusBarColor\">#05070e</item>\n        <item name=\"android:navigationBarColor\">#05070e</item>\n        <item name=\"android:windowBackground\">#05070e</item>\n    </style>"
              );
              fs.writeFileSync(stylesPath, styles);
            }
          '
          npx cap sync android

      - name: Biên dịch file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
